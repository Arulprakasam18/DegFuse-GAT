[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "degfuse-gat"
version = "1.0.0"
description = "Degree-Aware Fused Sparse Attention Kernels for Graph Attention Networks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Arulprakasam, J"},
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
